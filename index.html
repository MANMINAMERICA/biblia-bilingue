<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a237e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Biblia Bilingüe Español-Coreano (RVR1960 + KRV)">
    <title>Biblia Bilingüe</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-icon">&#128214;</div>
            <h2>Biblia Bilingüe</h2>
            <p>Español (RVR1960) &bull; 한국어 (KRV)</p>
            <div class="loading-bar">
                <div class="loading-bar-fill" id="loading-progress"></div>
            </div>
            <p id="loading-text">Cargando datos...</p>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="hidden">
        <!-- Header -->
        <header id="header">
            <button id="btn-back" class="icon-btn hidden" onclick="goBack()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <h1 id="header-title">Biblia Bilingüe</h1>
            <div class="header-actions">
                <button id="btn-search" class="icon-btn" onclick="toggleSearch()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                    </svg>
                </button>
                <button id="btn-theme" class="icon-btn" onclick="toggleTheme()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div id="search-bar" class="hidden">
            <input type="text" id="search-input" placeholder="Buscar en la Biblia..." oninput="debounceSearch()">
            <button class="icon-btn" onclick="clearSearch()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Content Views -->
        <main id="content">
            <!-- Home View -->
            <div id="view-home" class="view">
                <div class="testament-tabs">
                    <button class="tab-btn active" onclick="showBooks('old')">Antiguo</button>
                    <button class="tab-btn" onclick="showBooks('new')">Nuevo</button>
                    <div class="lang-toggle">
                        <button class="lang-btn active" onclick="setLangMode('dual')">ES+KO</button>
                        <button class="lang-btn" onclick="setLangMode('es')">ES</button>
                        <button class="lang-btn" onclick="setLangMode('ko')">KO</button>
                    </div>
                </div>
                <div id="close-books-list" class="close-books-btn hidden" onclick="closeBooksList()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </div>
                <div class="home-hero">
                    <div class="hero-icon">&#128214;</div>
                    <h2>Biblia Bilingüe</h2>
                    <p class="hero-subtitle">Reina Valera 1960 &bull; 개역한글 1961</p>
                </div>
                <div class="home-search">
                    <div class="home-search-box">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
                        </svg>
                        <input type="text" id="home-search-input" 
                               placeholder="Buscar: Marcos 3:5, Salmo 23, Juan 3:16..." 
                               onkeydown="if(event.key==='Enter') homeSearch()"
                               oninput="toggleClearBtn()">
                        <button id="home-clear-btn" class="home-clear-btn hidden" onclick="clearHomeSearch()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <path d="M18 6L6 18M6 6l12 12"/>
                            </svg>
                        </button>
                        <button class="home-search-btn" onclick="homeSearch()">Buscar</button>
                    </div>
                    <p class="home-search-hint">Escribe libro, capítulo y versículo (ej: <strong>Mar 3:5</strong>, <strong>Salmos 23</strong>, <strong>Juan 3:16-18</strong>)</p>
                </div>
                <div id="home-books-list" class="home-books-list"></div>
            </div>

            <!-- Books View (not used anymore) -->
            <div id="view-books" class="view hidden">
                <div id="books-list" class="books-grid"></div>
            </div>

            <!-- Chapters View -->
            <div id="view-chapters" class="view hidden">
                <h2 id="chapters-book-name" class="section-title"></h2>
                <div id="chapters-grid" class="chapters-grid"></div>
            </div>

            <!-- Reading View -->
            <div id="view-reading" class="view hidden">
                <div id="reading-header" class="reading-header">
                    <span id="reading-ref"></span>
                    <div class="reading-nav">
                        <button id="btn-prev-chapter" class="nav-btn" onclick="prevChapter()">&#9664;</button>
                        <button id="btn-next-chapter" class="nav-btn" onclick="nextChapter()">&#9654;</button>
                    </div>
                </div>
                <p class="reading-hint">Doble toque para seleccionar versículos</p>
                <div id="verses-container" class="verses-container"></div>
            </div>

            <!-- Search Results View -->
            <div id="view-search" class="view hidden">
                <div id="search-results-header" class="search-results-header"></div>
                <div id="search-results" class="search-results"></div>
            </div>
        </main>

        <!-- Selection Toolbar -->
        <div id="selection-toolbar" class="selection-toolbar">
            <span id="selection-count">0 versículo(s) seleccionado(s)</span>
            <div class="selection-actions">
                <button onclick="selectAllVerses()" class="sel-btn">Todos</button>
                <button onclick="copySelectedVerses()" class="sel-btn sel-btn-primary">Copiar</button>
                <button onclick="clearSelection()" class="sel-btn">Cancelar</button>
            </div>
        </div>

        <!-- Toast -->
        <div id="toast" class="toast"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
